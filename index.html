<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple JavaScript pseudo-obfuscation demo"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" type="image/png" href="/trident.png" />
    <title>Wobfus — JavaScript obfuscator demo</title>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1 class="brand">
          <img class="brand-logo" src="/trident.png" alt="" width="40" height="48" />
          Wobfus
        </h1>
        <p class="subtitle">JavaScript obfuscation playground</p>
      </header>

      <form class="workspace" id="obfuscator">
        <div class="editor">
          <div class="field-heading" id="source-label">Source code</div>
          <div
            class="code-editor"
            id="source"
            aria-labelledby="source-label"
          ></div>
          <p class="file-size">Source size: <span id="source-size">0 bytes</span></p>
        </div>

        <div class="editor result-editor">
          <div class="field-heading" id="output-label">Obfuscated output</div>
          <div
            class="code-editor"
            id="output"
            aria-labelledby="output-label"
          ></div>
          <p class="file-size">Output size: <span id="output-size">0 bytes</span></p>
        </div>
        <iframe
          id="preview-frame"
          title="Obfuscated code runner"
          sandbox="allow-scripts"
          referrerpolicy="no-referrer"
          hidden
        ></iframe>
        <button class="run-button" id="obfuscate-button" type="submit">
          <span>Obfuscate code</span>
          <span aria-hidden="true">→</span>
        </button>
        <button class="run-button preview-button" id="preview-button" type="button" disabled>
          <span>Run obfuscated code</span>
          <span aria-hidden="true">▶</span>
        </button>
      </form>
    </main>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
